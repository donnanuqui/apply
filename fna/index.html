<style>
  /* Same look as apply.donnanuqui.com: one calm column, progress rail on top, fixed Back/Next bar. */
  :root{
    color-scheme: only light;
    --bg:#FDFCFA; --card:#FFFFFF; --ink:#16150F; --muted:#4F4C45; --faint:#8A857A;
    --line:#E9E3D8; --soft:#F6F2EA; --gold:#B89C6E; --goldd:#8B6F3F; --goldl:#F2EAD9;
    --err:#B3412E; --errl:#FBEDE9; --ok:#4F7A55;
    --display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --barh:84px;
  }
  *{ box-sizing:border-box; }
  html,body{ background:var(--bg); }
  body{ margin:0; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap{ max-width:640px; margin:0 auto; padding-inline:20px; padding-block:0 calc(var(--barh) + 48px); }

  .top{ display:flex; align-items:center; gap:12px; padding-block:20px 14px; }
  .top img{ width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--goldl); }
  .top b{ display:block; font-family:var(--display); font-size:1.3rem; font-weight:600; letter-spacing:.01em; line-height:1.1; }
  .top span{ font-size:.8rem; color:var(--muted); }

  .prog{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:10px 12px; border-bottom:1px solid var(--line); margin-inline:-20px; padding-inline:20px; }
  .prog-row{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:.78rem; color:var(--muted); }
  .prog-row b{ color:var(--ink); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:.72rem; }
  .prog-bar{ height:4px; background:var(--line); border-radius:4px; margin-top:8px; overflow:hidden; }
  .prog-bar i{ display:block; height:100%; width:0; background:var(--goldd); border-radius:4px; transition:width .3s ease; }

  .step-h{ font-family:var(--display); font-weight:600; font-size:2rem; line-height:1.1; margin:26px 0 6px; text-wrap:balance; }
  .step-p{ color:var(--muted); margin:0 0 18px; max-width:60ch; }
  .sec{ font-size:.72rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--goldd); margin:26px 0 10px; padding-top:18px; border-top:1px solid var(--line); }
  .sec:first-child{ border-top:0; padding-top:0; margin-top:6px; }
  .note{ background:var(--soft); border-left:3px solid var(--gold); padding:12px 14px; font-size:.88rem; color:var(--muted); margin:6px 0 14px; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .grid > .sec, .grid > .note{ grid-column:1 / -1; }
  .f{ grid-column:1 / -1; margin-bottom:16px; min-width:0; scroll-margin-top:96px; scroll-margin-bottom:110px; }
  .f.half{ grid-column:auto; }
  .f > label, .f > .lbl{ display:block; font-size:.86rem; font-weight:600; margin-bottom:6px; }
  .f .req{ color:var(--err); margin-left:2px; }
  .f .opt{ font-weight:400; color:var(--faint); font-size:.8rem; margin-left:4px; }
  .f .hint{ display:block; font-weight:400; color:var(--faint); font-size:.8rem; margin-top:2px; }
  .f .help{ font-size:.78rem; color:var(--faint); margin-top:8px; }
  input[type=text], select, textarea{
    width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--card);
    border:1px solid #D9D1C2; border-radius:8px; padding:11px 12px; min-height:46px; appearance:none; -webkit-appearance:none;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--goldd); box-shadow:0 0 0 3px var(--goldl); }

  /* Question card */
  .q{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 14px 6px; margin-bottom:14px; }
  .q > .lbl{ font-weight:600 !important; font-size:.95rem !important; line-height:1.45; margin-bottom:10px !important; }
  .q > .lbl .num{ color:var(--goldd); margin-right:4px; }

  /* Choice pills (short answers) */
  .pills{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .pills label{ position:relative; display:inline-flex; flex:1 1 auto; justify-content:center; text-align:center; align-items:center; min-height:44px; padding:10px 16px; border:1px solid #D9D1C2; border-radius:999px; background:var(--card); cursor:pointer; font-size:.92rem; font-weight:500; user-select:none; }
  .pills input{ position:absolute; opacity:0; width:1px; height:1px; }
  .pills label:has(input:checked){ background:var(--ink); border-color:var(--ink); color:#fff; }
  .pills label:has(input:focus-visible){ box-shadow:0 0 0 3px var(--goldl); }

  /* Option rows (answers with a title and a short explanation) */
  .rows{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .row{ display:flex; gap:12px; align-items:flex-start; padding:12px; border:1px solid #D9D1C2; border-radius:8px; background:var(--card); cursor:pointer; font-size:.92rem; line-height:1.4; }
  .row input{ width:20px; height:20px; margin:1px 0 0; accent-color:var(--ink); flex:0 0 20px; }
  .row b{ display:block; font-size:.76rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:2px; }
  .row span span{ color:var(--muted); }
  .row:has(input:checked){ border-color:var(--ink); background:var(--soft); }
  .row:has(input:focus-visible){ box-shadow:0 0 0 3px var(--goldl); }

  .f.bad input[type=text], .f.bad .pills label, .f.bad .row{ border-color:var(--err); }
  .f .msg{ display:none; color:var(--err); font-size:.8rem; margin:2px 0 8px; }
  .f.bad .msg{ display:block; }

  /* Review */
  .rv{ border:1px solid var(--line); border-radius:12px; background:var(--card); margin-bottom:12px; }
  .rv-h{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); }
  .rv-h b{ font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; }
  .rv dl{ margin:0; padding:6px 14px 10px; display:grid; grid-template-columns:minmax(0, 42%) minmax(0, 1fr); gap:6px 12px; font-size:.86rem; }
  .rv dt{ color:var(--muted); }
  .rv dd{ margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }
  .linkbtn{ background:none; border:0; padding:6px 0; font:inherit; font-size:.86rem; color:var(--goldd); text-decoration:underline; cursor:pointer; }
  .chk{ display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border:1px solid #D9D1C2; border-radius:8px; background:var(--card); cursor:pointer; font-size:.92rem; }
  .chk input{ width:20px; height:20px; margin:1px 0 0; accent-color:var(--ink); flex:0 0 20px; }
  .f.bad .chk{ border-color:var(--err); }

  /* Bottom bar */
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--bg); border-top:1px solid rgba(22,21,15,.16); box-shadow:0 -10px 24px -8px rgba(22,21,15,.18); padding:12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .bar-in{ max-width:640px; margin:0 auto; display:flex; gap:10px; }
  .btn{ min-height:52px; border-radius:0; font:inherit; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:.82rem; cursor:pointer; padding:0 18px; }
  .btn-back{ background:transparent; border:1px solid var(--ink); color:var(--ink); flex:0 0 auto; }
  .btn-next{ flex:1; background:var(--ink); border:1px solid var(--ink); color:#fff; }
  .btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .btn[disabled]{ opacity:.6; cursor:wait; }
  .saved{ text-align:center; font-size:.74rem; color:var(--faint); margin-top:14px; }
  .formerr{ background:var(--errl); color:var(--err); padding:12px 14px; border-radius:8px; font-size:.88rem; margin-bottom:14px; }

  .done{ text-align:center; padding-top:40px; }
  .done img{ width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid var(--goldl); }
  .done h1{ font-family:var(--display); font-size:2.2rem; font-weight:600; margin:16px 0 8px; }
  .done p{ color:var(--muted); max-width:46ch; margin:0 auto 12px; }

  body.typing .bar{ display:none; }
  body.typing .wrap{ padding-bottom:40vh; }
  @media (max-width:520px){
    .wrap{ padding-inline:16px; }
    .prog{ margin-inline:-16px; padding-inline:16px; }
    .f.half{ grid-column:1 / -1; }
    .f.half.keep{ grid-column:auto; }
    .top{ padding-block:14px 10px; }
    .top img{ width:38px; height:38px; }
    .step-h{ font-size:1.75rem; margin-top:20px; }
    .q{ padding:14px 12px 6px; }
    .rv dl{ grid-template-columns:1fr; gap:0; }
    .rv dt{ font-size:.78rem; margin-top:8px; }
    .rv dd{ font-size:.95rem; }
    .btn{ font-size:.8rem; padding:0 14px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>

    if(f.t === 'radio'){
      h += '<div class="lbl" id="' + id + '_l">' + labelHTML(f, id) + '</div><div class="pills" role="radiogroup" aria-labelledby="' + id + '_l">';
      f.opts.forEach(function(o, j){
        h += '<label><input type="radio" name="' + id + '" value="' + esc(o) + '" data-k="' + f.k + '"' + (v === o ? ' checked' : '') + '>' + esc(o) + '</label>';
      });
      h += '</div>';
    } else if(f.t === 'cards' || f.t === 'multi'){
      var multi = f.t === 'multi', sel = multi ? (Array.isArray(v) ? v : []) : v;
      h += '<div class="lbl" id="' + id + '_l">' + labelHTML(f, id) + '</div><div class="rows" role="' + (multi ? 'group' : 'radiogroup') + '" aria-labelledby="' + id + '_l">';
      f.opts.forEach(function(o, j){
        var p = splitOpt(o, f), on = multi ? sel.indexOf(o) > -1 : sel === o;
        h += '<label class="row"><input type="' + (multi ? 'checkbox' : 'radio') + '" name="' + id + '" value="' + esc(o) + '" data-k="' + f.k + '"' + (multi ? ' data-multi="1"' : '') + (on ? ' checked' : '') + '>'
          + '<span>' + (p.t ? '<b>' + esc(p.t) + '</b>' : '') + '<span>' + esc(p.s) + '</span></span></label>';
      });
      h += '</div>';
    } else {
      h += '<label for="' + id + '">' + labelHTML(f, id) + '</label>';
      h += '<input type="text" autocapitalize="words" enterkeyhint="next" id="' + id + '" data-k="' + f.k + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : '') + (f.ac ? ' autocomplete="' + f.ac + '"' : '') + ' value="' + esc(v || '') + '">';
    }
    if(f.help) h += '<div class="help">' + esc(f.help) + '</div>';
    h += '<div class="msg"></div></div>';
    return h;
  }

  function renderStep(){
    var s = STEPS[cur];
    document.getElementById('progName').textContent = s.name;
    document.getElementById('progCount').textContent = 'Step ' + (cur + 1) + ' of ' + STEPS.length;
    document.getElementById('progBar').style.width = Math.round((cur + 1) / STEPS.length * 100) + '%';
    document.getElementById('btnBack').style.visibility = cur === 0 ? 'hidden' : 'visible';
    document.getElementById('btnNext').innerHTML = cur === STEPS.length - 1 ? 'Submit answers' : (cur === STEPS.length - 2 ? 'Review answers &rarr;' : 'Next &rarr;');
    var html = '<h1 class="step-h">' + esc(s.h) + '</h1>' + (s.p ? '<p class="step-p">' + esc(s.p) + '</p>' : '');
    track('fna_step_view', { step_id:s.id, step_number:cur + 1 });
    if(s.id === 'review'){ app.innerHTML = html + reviewHTML(); bindReview(); return; }
    html += '<div class="grid">';
    s.fields.forEach(function(f, i){ html += fieldHTML(f, i); });
    app.innerHTML = html + '</div>';
  }

  app.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type !== 'text') return;
    e.preventDefault();
    var list = Array.prototype.slice.call(app.querySelectorAll('input[type=text]'));
    var i = list.indexOf(e.target);
    if(i > -1 && list[i + 1]) list[i + 1].focus(); else e.target.blur();
  });
  /* Hide the Back/Next bar while the phone keyboard is open */
  if(window.visualViewport){
    var baseH = window.innerHeight;
    var kb = function(){
      if(!document.activeElement || !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) baseH = Math.max(baseH, window.innerHeight);
      document.body.classList.toggle('typing', baseH - window.visualViewport.height > 150);
    };
    window.visualViewport.addEventListener('resize', kb);
  }

  var answered = {};
  function onInput(e){
    var el = e.target, k = el.getAttribute && el.getAttribute('data-k');
    if(!k) return;
    if(el.getAttribute('data-multi')){
      var arr = Array.isArray(d[k]) ? d[k].slice() : [];
      var ix = arr.indexOf(el.value);
      if(el.checked && ix < 0) arr.push(el.value);
      if(!el.checked && ix > -1) arr.splice(ix, 1);
      /* keep Sun Life's order */
      var f = findField(k);
      if(f) arr.sort(function(a, b){ return f.opts.indexOf(a) - f.opts.indexOf(b); });
      d[k] = arr;
      if(el.checked) track('fna_option_toggle', { question:k, option_index:(f ? f.opts.indexOf(el.value) + 1 : 0) });
    } else {
      d[k] = el.value;
    }
    save();
    if(e.type === 'change' && !answered[k]){ answered[k] = 1; track('fna_answer', { question:k }); }
    var wrap = el.closest('.f'); if(wrap && e.type === 'change') wrap.classList.remove('bad');
  }
  app.addEventListener('input', onInput);
  app.addEventListener('change', onInput);
  function findField(k){
    for(var i = 0; i < STEPS.length; i++) for(var j = 0; j < STEPS[i].fields.length; j++) if(STEPS[i].fields[j].k === k) return STEPS[i].fields[j];
    return null;
  }

  /* ===== Validation ===== */
  function checkField(f){
    var v = valStr(d[f.k]).trim();
    if(isReq(f) && !v) return f.t === 'multi' ? 'Please choose at least one.' : (f.t === 'text' ? 'Please fill this in.' : 'Please choose one.');
    return '';
  }
  function validateStep(idx, mark){
    var s = STEPS[idx], first = null, ok = true;
    s.fields.forEach(function(f, i){
      if(!f.k || !visible(f)) return;
      var msg = checkField(f);
      if(mark){
        var el = app.querySelector('[data-i="' + i + '"]');
        if(el){ el.classList.toggle('bad', !!msg); var m = el.querySelector('.msg'); if(m) m.textContent = msg; }
        if(msg && !first) first = el;
      }
      if(msg) ok = false;
    });
    if(first){ first.scrollIntoView({ behavior:'smooth', block:'center' }); track('fna_validation_error', { step_id:s.id }); }
    return ok;
  }

  /* ===== Review + data rows ===== */
  function rowsFor(idx){
    var out = [];
    STEPS[idx].fields.forEach(function(f){
      if(!f.k || !visible(f)) return;
      var v = valStr(d[f.k]); if(!v) return;
      out.push([f.col + ' · ' + (f.n ? f.n + '. ' : '') + f.l, v, (f.n ? f.n + '. ' : '') + f.l]);
    });
    return out;
  }
  function reviewHTML(){
    var h = '';
    for(var i = 0; i < STEPS.length - 1; i++){
      var r = rowsFor(i);
      h += '<section class="rv"><div class="rv-h"><b>' + esc(STEPS[i].name) + '</b><button type="button" class="linkbtn" data-edit="' + i + '">Edit</button></div><dl>';
      h += r.length ? r.map(function(x){ return '<dt>' + esc(x[2]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') : '<dt>No answers</dt><dd></dd>';
      h += '</dl></section>';
    }
    h += '<div class="f" data-i="cert" style="margin-top:18px"><label class="chk" for="f_cert"><input type="checkbox" id="f_cert"' + (d.cert === 'Yes' ? ' checked' : '') + '><span>I confirm that my answers above are true. I agree to let Donna Nuqui, a licensed financial advisor, use them to recommend a suitable Sun Life plan, in line with the Data Privacy Act of 2012.</span></label><div class="msg">Please tick the box to confirm.</div></div>';
    return h + '<div id="formErr"></div>';
  }
  function bindReview(){
    Array.prototype.forEach.call(app.querySelectorAll('[data-edit]'), function(b){
      b.addEventListener('click', function(){ track('fna_review_edit', { step_id:STEPS[+this.getAttribute('data-edit')].id }); go(parseInt(this.getAttribute('data-edit'), 10)); });
    });
    document.getElementById('f_cert').addEventListener('change', function(){ d.cert = this.checked ? 'Yes' : ''; save(); this.closest('.f').classList.remove('bad'); });
  }

  /* ===== Navigation ===== */
  function go(n){
    cur = Math.max(0, Math.min(STEPS.length - 1, n));
    try { localStorage.setItem(STORE_KEY + '-step', String(cur)); } catch(e){}
    renderStep();
    window.scrollTo(0, 0);
  }
  document.getElementById('btnBack').addEventListener('click', function(){ go(cur - 1); });
  document.getElementById('btnNext').addEventListener('click', function(){
    if(STEPS[cur].id === 'review'){ submit(); return; }
    if(!validateStep(cur, true)) return;
    go(cur + 1);
  });

  /* ===== Submit to Google Sheet (saved to the "FNA" tab) ===== */
  function submit(){
    for(var i = 0; i < STEPS.length - 1; i++){
      if(!validateStep(i, false)){ go(i); setTimeout(function(){ validateStep(cur, true); }, 50); return; }
    }
    if(d.cert !== 'Yes'){ var c = app.querySelector('[data-i="cert"]'); c.classList.add('bad'); c.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    var rows = [];
    for(var j = 0; j < STEPS.length - 1; j++){ rowsFor(j).forEach(function(r){ rows.push([r[0], r[1]]); }); }
    var payload = {
      form: 'FNA',
      ref: ref,
      name: [d.First, d.Middle, d.Last, d.Suffix].filter(Boolean).join(' '),
      firstName: d.First || '',
      rows: rows
    };
    var btn = document.getElementById('btnNext');
    var errBox = document.getElementById('formErr');
    errBox.innerHTML = '';
    if(!/^https:\/\/script\.google\.com\//.test(APP_URL)){
      errBox.innerHTML = '<div class="formerr">This form isn’t connected to the Google Sheet yet, so nothing was sent. Please message Donna on <a href="' + MESSENGER + '" target="_blank" rel="noopener">Messenger</a>.</div>';
      return;
    }
    btn.disabled = true; btn.textContent = 'Sending…';
    fetch(APP_URL, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function(){
        track('fna_submit', { ref:ref });
        try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(STORE_KEY + '-step'); } catch(e){}
        showDone(d.First);
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = 'Submit answers';
        errBox.innerHTML = '<div class="formerr">We couldn’t send your answers. Please check your internet connection and tap Submit again. Your answers are still saved on this device.</div>';
      });
  }
  function showDone(first){
    document.getElementById('bar').hidden = true;
    document.getElementById('prog').hidden = true;
    document.getElementById('savedNote').hidden = true;
    app.innerHTML = '<div class="done"><img src="' + DONNA_IMG + '" alt="Donna Nuqui" width="84" height="84"><h1>Thank you' + (first ? ', ' + esc(first) : '') + '!</h1>'
      + '<p>I’ve received your answers. I’ll use them to prepare a plan recommendation that fits your goals, and I’ll message you once it’s ready.</p>'
      + '<p><a href="' + MESSENGER + '" target="_blank" rel="noopener" id="msgBtn" class="btn btn-next" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:0 24px">Message Donna</a></p></div>';
    document.getElementById('msgBtn').addEventListener('click', function(){ track('fna_messenger_click'); });
    window.scrollTo(0, 0);
  }

  renderStep();
})();
</script>
</body>
</html>
