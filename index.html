<!doctype html>
<html lang="en-PH" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex, nofollow">
<title>E-Application Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one calm column, a progress rail on top, a fixed Back/Next bar at the bottom — like Jotform's card pages, in Donna's brand. */
  :root{
    color-scheme: only light;
    --bg:#FDFCFA; --card:#FFFFFF; --ink:#16150F; --muted:#4F4C45; --faint:#8A857A;
    --line:#E9E3D8; --soft:#F6F2EA; --gold:#B89C6E; --goldd:#8B6F3F; --goldl:#F2EAD9;
    --err:#B3412E; --errl:#FBEDE9; --ok:#4F7A55;
    --display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    --barh:84px;
  }
  *{ box-sizing:border-box; }
  html,body{ background:var(--bg); }
  body{ margin:0; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; }
  .wrap{ max-width:640px; margin:0 auto; padding-inline:20px; padding-block:0 calc(var(--barh) + 48px); }

  /* Header */
  .top{ display:flex; align-items:center; gap:12px; padding-block:20px 14px; }
  .top img{ width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--goldl); }
  .top b{ display:block; font-family:var(--display); font-size:1.3rem; font-weight:600; letter-spacing:.01em; line-height:1.1; }
  .top span{ font-size:.8rem; color:var(--muted); }

  /* Progress */
  .prog{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); padding-block:10px 12px; border-bottom:1px solid var(--line); margin-inline:-20px; padding-inline:20px; }
  .prog-row{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:.78rem; color:var(--muted); }
  .prog-row b{ color:var(--ink); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:.72rem; }
  .prog-bar{ height:4px; background:var(--line); border-radius:4px; margin-top:8px; overflow:hidden; }
  .prog-bar i{ display:block; height:100%; width:0; background:var(--goldd); border-radius:4px; transition:width .3s ease; }

  /* Step */
  .step-h{ font-family:var(--display); font-weight:600; font-size:2rem; line-height:1.1; margin:26px 0 6px; text-wrap:balance; }
  .step-p{ color:var(--muted); margin:0 0 18px; max-width:60ch; }
  .sec{ font-size:.72rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--goldd); margin:26px 0 10px; padding-top:18px; border-top:1px solid var(--line); }
  .sec:first-child{ border-top:0; padding-top:0; margin-top:6px; }
  .tip{ font-size:.84rem; color:var(--muted); background:var(--goldl); border-radius:8px; padding:10px 12px; margin:0 0 18px; }
  .tip b{ color:var(--ink); }
  .note{ background:var(--soft); border-left:3px solid var(--gold); padding:12px 14px; font-size:.88rem; color:var(--muted); margin:6px 0 14px; }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .grid > .sec, .grid > .note, .grid > .ben, .grid > .addbtn{ grid-column:1 / -1; }
  .f{ grid-column:1 / -1; margin-bottom:16px; min-width:0; }
  .f.half{ grid-column:auto; }
  @media (max-width:420px){ .f.half{ grid-column:1 / -1; } .f.half.keep{ grid-column:auto; } }
  .f > label, .f > .lbl{ display:block; font-size:.86rem; font-weight:600; margin-bottom:6px; }
  .f .req{ color:var(--err); margin-left:2px; }
  .f .opt{ font-weight:400; color:var(--faint); font-size:.8rem; margin-left:4px; }
  .f .help{ font-size:.78rem; color:var(--faint); margin-top:5px; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], select, textarea{
    width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--card);
    border:1px solid #D9D1C2; border-radius:8px; padding:11px 12px; min-height:46px; appearance:none; -webkit-appearance:none;
  }
  input[type=date]{ min-height:46px; }
  select{ background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:34px; }
  textarea{ min-height:96px; resize:vertical; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--goldd); box-shadow:0 0 0 3px var(--goldl); }
  .unit{ position:relative; }
  .unit input{ padding-right:46px; }
  .unit em{ position:absolute; right:12px; top:50%; transform:translateY(-50%); font-style:normal; color:var(--faint); font-size:.88rem; pointer-events:none; }

  /* Choice pills (radio / yes-no) */
  .pills{ display:flex; flex-wrap:wrap; gap:8px; }
  .pills label{ position:relative; display:inline-flex; align-items:center; min-height:44px; padding:10px 16px; border:1px solid #D9D1C2; border-radius:999px; background:var(--card); cursor:pointer; font-size:.92rem; font-weight:500; user-select:none; }
  .pills input{ position:absolute; opacity:0; width:1px; height:1px; }
  .pills label:has(input:checked){ background:var(--ink); border-color:var(--ink); color:#fff; }
  .pills label:has(input:focus-visible){ box-shadow:0 0 0 3px var(--goldl); }
  .pills.yn label{ min-width:84px; justify-content:center; }

  .q{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 14px 4px; margin-bottom:12px; }
  .q > .lbl{ font-weight:500 !important; line-height:1.45; }

  .checks{ display:flex; flex-direction:column; gap:8px; }
  .chk{ display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border:1px solid #D9D1C2; border-radius:8px; background:var(--card); cursor:pointer; font-size:.92rem; }
  .chk input{ width:20px; height:20px; margin:1px 0 0; accent-color:var(--ink); flex:0 0 20px; }
  .chk:has(input:checked){ border-color:var(--ink); }

  .f.bad input, .f.bad select, .f.bad textarea, .f.bad .pills label{ border-color:var(--err); }
  .f .msg{ display:none; color:var(--err); font-size:.8rem; margin-top:5px; }
  .f.bad .msg{ display:block; }
  .sub-block{ border-left:2px solid var(--goldl); padding-left:14px; margin:-4px 0 12px; }

  .ben{ border:1px solid var(--line); border-radius:12px; padding:16px 16px 4px; margin-bottom:14px; background:var(--card); }
  .ben-h{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .ben-h b{ font-family:var(--display); font-size:1.3rem; font-weight:600; }
  .linkbtn{ background:none; border:0; padding:6px 0; font:inherit; font-size:.86rem; color:var(--goldd); text-decoration:underline; cursor:pointer; }
  .addbtn{ width:100%; min-height:48px; border:1px dashed var(--gold); background:transparent; border-radius:12px; font:inherit; font-weight:600; color:var(--goldd); cursor:pointer; margin-bottom:14px; }

  /* Review */
  .rv{ border:1px solid var(--line); border-radius:12px; background:var(--card); margin-bottom:12px; }
  .rv-h{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); }
  .rv-h b{ font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; }
  .rv dl{ margin:0; padding:6px 14px 10px; display:grid; grid-template-columns:minmax(0, 42%) minmax(0, 1fr); gap:6px 12px; font-size:.86rem; }
  .rv dt{ color:var(--muted); }
  .rv dd{ margin:0; overflow-wrap:anywhere; white-space:pre-wrap; }

  /* Bottom bar */
  .bar{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--bg); border-top:1px solid rgba(22,21,15,.16); box-shadow:0 -10px 24px -8px rgba(22,21,15,.18); padding:12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .bar-in{ max-width:640px; margin:0 auto; display:flex; gap:10px; }
  .btn{ min-height:52px; border-radius:0; font:inherit; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:.82rem; cursor:pointer; padding:0 18px; }
  .btn-back{ background:transparent; border:1px solid var(--ink); color:var(--ink); flex:0 0 auto; }
  .btn-next{ flex:1; background:var(--ink); border:1px solid var(--ink); color:#fff; }
  .btn:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  .btn[disabled]{ opacity:.6; cursor:wait; }
  .saved{ text-align:center; font-size:.74rem; color:var(--faint); margin-top:14px; }
  .formerr{ background:var(--errl); color:var(--err); padding:12px 14px; border-radius:8px; font-size:.88rem; margin-bottom:14px; }

  /* Done */
  .done{ text-align:center; padding-top:40px; }
  .done img{ width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid var(--goldl); }
  .done h1{ font-family:var(--display); font-size:2.2rem; font-weight:600; margin:16px 0 8px; }
  .done p{ color:var(--muted); max-width:46ch; margin:0 auto 12px; }
  .done ol{ text-align:left; max-width:440px; margin:18px auto 0; padding-left:20px; color:var(--ink); font-size:.92rem; }
  .done li{ margin-bottom:6px; }
  /* ---- Phone tuning ---- */
  .f{ scroll-margin-top:96px; scroll-margin-bottom:110px; }
  .dob{ display:grid; grid-template-columns:1.4fr 1fr 1.2fr; gap:8px; }
  .pills label{ flex:1 1 auto; justify-content:center; text-align:center; }
  body.typing .bar{ display:none; }
  body.typing .wrap{ padding-bottom:40vh; }
  @media (max-width:520px){
    .wrap{ padding-inline:16px; }
    .prog{ margin-inline:-16px; padding-inline:16px; }
    .f.half{ grid-column:1 / -1; }
    .f.half.keep{ grid-column:auto; }
    .top{ padding-block:14px 10px; }
    .top img{ width:38px; height:38px; }
    .step-h{ font-size:1.75rem; margin-top:20px; }
    .q{ padding:14px 12px 4px; }
    .q > .lbl{ font-size:.95rem; }
    .pills.yn label{ flex:1 1 0; }
    .ben{ padding:14px 12px 4px; }
    .rv dl{ grid-template-columns:1fr; gap:0; }
    .rv dt{ font-size:.78rem; margin-top:8px; }
    .rv dd{ font-size:.95rem; }
    .btn{ font-size:.8rem; padding:0 14px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; scroll-behavior:auto !important; } }
</style>
</head>

<script>
(function(){

  var MESSENGER = 'https://m.me/financial.advisor.donna.n';
  var STORE_KEY = 'dn-eapp-draft-v1';
  var DONNA_IMG = document.querySelector('.top img').src;

  /* ===== Answers ===== */
  var d = {};
  try { d = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch(e){ d = {}; }
  if(!d.benCount) d.benCount = 1;
  var ref = '';
  try { ref = new URLSearchParams(location.search).get('ref') || ''; } catch(e){}
  function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch(e){} }

  var TODAY = new Date().toISOString().slice(0, 10);
  var notMe = function(){ return d.applyFor && d.applyFor !== 'Myself'; };
  var isMe = function(){ return d.applyFor === 'Myself'; };
  function yes(k){ return function(){ return d[k] === 'Yes'; }; }

  /* ===== Field builders ===== */
  var YN = ['Yes', 'No'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var CIVIL = ['Single', 'Married', 'Widowed', 'Divorced', 'Legally Separated', 'Other'];
  function nameFields(p, col, req, show){
    var self = p === 'o' || p === '';
    return [
      { k:p+'First', l:'First name', t:'text', req:req, half:true, col:col, show:show, ac: self ? 'given-name' : 'off' },
      { k:p+'Middle', l:'Middle name', t:'text', half:true, col:col, show:show, ac: self ? 'additional-name' : 'off' },
      { k:p+'Last', l:'Last name', t:'text', req:req, half:true, col:col, show:show, ac: self ? 'family-name' : 'off' },
      { k:p+'Suffix', l:'Suffix', t:'text', half:true, keep:true, ph:'Jr., III', col:col, show:show }
    ];
  }
  function addrFields(p, col, req, show){
    return [
      { k:p+'Street', l:'House no., street, village/subdivision', t:'text', req:req, col:col, show:show },
      { k:p+'Brgy', l:'Barangay', t:'text', req:req, half:true, col:col, show:show },
      { k:p+'City', l:'City / Municipality', t:'text', req:req, half:true, col:col, show:show },
      { k:p+'Prov', l:'Province / State', t:'text', req:req, half:true, col:col, show:show },
      { k:p+'Zip', l:'Zip code', t:'text', half:true, keep:true, im:'numeric', col:col, show:show },
      { k:p+'Country', l:'Country', t:'country', req:req, col:col, show:show, def:'Philippines' }
    ];
  }

  /* ===== Steps (same questions as the Jotform, grouped into short pages) ===== */
  var STEPS = [
    { id:'start', name:'Getting started', h:'Let’s start your application', p:'This takes about 10–15 minutes. Have a valid ID nearby for the TIN and SSS/GSIS numbers. Everything you share goes only to me, for preparing your Sun Life application.',

        { t:'sec', l:'Policy owner (the one who will pay for the plan)', show:notMe },
        { t:'note', l:'You’re applying for someone else, so please fill in your own details here first. The next pages are about the person to be insured.', show:notMe }
      ].concat(nameFields('o', 'Policy owner', true, notMe)).concat([

        { k:'oSex', l:'Sex (at birth)', t:'radio', opts:['Male', 'Female'], req:true, show:notMe, col:'Policy owner' },
        { k:'oBday', l:'Birthdate', t:'date', req:true, half:true, show:notMe, col:'Policy owner' },
        { k:'oCivil', l:'Civil status', t:'select', opts:CIVIL, req:true, half:true, show:notMe, col:'Policy owner' },
        { k:'oMobile', l:'Mobile number', t:'tel', req:true, half:true, show:notMe, col:'Policy owner' },
        { k:'oEmail', l:'Email', t:'email', req:true, half:true, show:notMe, col:'Policy owner' },
        { k:'oOcc', l:'Occupation / position', t:'text', req:true, half:true, show:notMe, col:'Policy owner' },
        { k:'oEmployer', l:'Employer / name of business', t:'text', req:true, half:true, show:notMe, col:'Policy owner' },
        { k:'oIncome', l:'Annual income (₱)', t:'text', ph:'e.g. 600,000', req:true, half:true, show:notMe, col:'Policy owner' },
        { k:'oTin', l:'TIN', t:'text', im:'numeric', half:true, show:notMe, col:'Policy owner', either:'oSss', ctx:notMe, help:'Enter at least one: TIN or SSS/GSIS.' },
        { k:'oSss', l:'SSS / GSIS number', t:'text', im:'numeric', half:true, show:notMe, col:'Policy owner', either:'oTin', ctx:notMe }
      ]) },

    { id:'personal', name:'Personal details', h:'Personal details', p:'', fields:[
      { t:'note', l:'Please enter the details of the person to be insured.', show:notMe }
    ].concat(nameFields('', 'Insured', true)).concat([
      { k:'sex', l:'Sex (at birth)', t:'radio', opts:['Male', 'Female'], req:true, col:'Insured' },
      { k:'bday', l:'Birthdate', t:'date', req:true, half:true, col:'Insured' },
      { k:'civil', l:'Civil status', t:'select', opts:CIVIL, req:true, half:true, col:'Insured' },
      { t:'sec', l:'Birthplace' },
      { k:'bpCity', l:'City / Municipality', t:'text', req:true, half:true, col:'Insured birthplace' },
      { k:'bpProv', l:'Province / State', t:'text', req:true, half:true, col:'Insured birthplace' },
      { k:'bpCountry', l:'Country', t:'country', req:true, def:'Philippines', col:'Insured birthplace' },
      { t:'sec', l:'Citizenship and IDs' },
      { k:'citizen', l:'Citizenship / nationality', t:'radio', opts:['Filipino', 'Other'], req:true, col:'Insured' },
      { k:'citizenOther', l:'Other citizenship(s)', t:'text', req:true, show:function(){ return d.citizen === 'Other'; }, col:'Insured' },
      { k:'tin', l:'TIN', t:'text', im:'numeric', half:true, col:'Insured', either:'sss', ctx:isMe, help:'Enter at least one: TIN or SSS/GSIS.' },
      { k:'sss', l:'SSS / GSIS number', t:'text', im:'numeric', half:true, col:'Insured', either:'tin', ctx:isMe },
      { t:'sec', l:'Contact' },
      { k:'mobile', l:'Mobile number', t:'tel', req:isMe, half:true, ph:'09XX XXX XXXX', col:'Insured' },
      { k:'email', l:'Email', t:'email', req:isMe, half:true, col:'Insured' },
      { t:'sec', l:'Height and weight' },
      { k:'height', l:'Height', t:'number', unit:'cm', req:true, half:true, keep:true, col:'Insured' },
      { k:'weight', l:'Weight', t:'number', unit:'kg', req:true, half:true, keep:true, col:'Insured' }
    ]) },

    { id:'address', name:'Address', h:'Address', p:'', fields:
      [{ t:'sec', l:'Present address' }].concat(addrFields('pa', 'Present address', true)).concat([
        { t:'sec', l:'Permanent address' },
        { k:'permSame', l:'Is the permanent address the same as the present address?', t:'radio', opts:['Same as present address', 'Different from present address'], req:true, col:'Permanent address' }
      ]).concat(addrFields('pm', 'Permanent address', true, function(){ return d.permSame === 'Different from present address'; })) },

    { id:'work', name:'Work and income', h:'Work and income', p:'About the person to be insured.', fields:[
      { t:'note', l:'For a child, just write “Child” or “Student” under occupation and leave the rest blank.', show:notMe },
      { k:'occ', l:'Primary occupation / position', t:'text', req:true, col:'Work' },
      { k:'natureWork', l:'Nature of work', t:'text', req:isMe, ph:'e.g. Office-based, field work', col:'Work' },
      { k:'employer', l:'Employer / name of business', t:'text', req:isMe, col:'Work' },
      { k:'natureBiz', l:'Nature of business', t:'text', req:isMe, ph:'e.g. IT services, retail', col:'Work' },
      { k:'years', l:'Total years in employment / business', t:'text', ph:'e.g. 5', req:isMe, half:true, col:'Work' },
      { k:'income', l:'Annual income (₱)', t:'text', ph:'e.g. 600,000', req:isMe, half:true, col:'Work' },
      { t:'sec', l:'Business / office address', show:isMe }
    ].concat(addrFields('ba', 'Business address', false, isMe)).concat([
      { k:'otherOcc', l:'I have another occupation or business', t:'check', col:'Other occupation' },

    for(var i = 0; i < STEPS.length - 1; i++){
      var r = rowsFor(i);
      h += '<section class="rv"><div class="rv-h"><b>' + esc(STEPS[i].name) + '</b><button type="button" class="linkbtn" data-edit="' + i + '">Edit</button></div><dl>';
      h += r.length ? r.map(function(x){ return '<dt>' + esc(/^(Insured|Policy owner|Health|Lifestyle|Work|Application) · /.test(x[0]) ? x[2] : x[0]) + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') : '<dt>No answers</dt><dd></dd>';
      h += '</dl></section>';
    }
    h += '<div class="f" data-i="cert" style="margin-top:18px"><label class="chk" for="f_cert"><input type="checkbox" id="f_cert"' + (d.cert === 'Yes' ? ' checked' : '') + '><span>I confirm that the information above is true and complete. I agree to let Donna Nuqui, a licensed financial advisor, use it to prepare my Sun Life application, in line with the Data Privacy Act of 2012.</span></label><div class="msg">Please tick the box to confirm.</div></div>';
    h += '<div id="formErr"></div>';
    return h;
  }
  function bindReview(){
    Array.prototype.forEach.call(app.querySelectorAll('[data-edit]'), function(b){
      b.addEventListener('click', function(){ go(parseInt(this.getAttribute('data-edit'), 10)); });
    });
    document.getElementById('f_cert').addEventListener('change', function(){ d.cert = this.checked ? 'Yes' : ''; save(); this.closest('.f').classList.remove('bad'); });
  }

  /* ===== Navigation ===== */
  function go(n){
    cur = Math.max(0, Math.min(STEPS.length - 1, n));
    try { localStorage.setItem(STORE_KEY + '-step', String(cur)); } catch(e){}
    renderStep();
    window.scrollTo(0, 0);
  }
  document.getElementById('btnBack').addEventListener('click', function(){ go(cur - 1); });
  document.getElementById('btnNext').addEventListener('click', function(){
    if(STEPS[cur].id === 'review'){ submit(); return; }
    if(!validateStep(cur, true)) return;
    go(cur + 1);
  });

  /* ===== Submit to Google Sheet ===== */
  function submit(){
    for(var i = 0; i < STEPS.length - 1; i++){
      if(!validateStep(i, false)){ go(i); setTimeout(function(){ validateStep(cur, true); }, 50); return; }
    }
    if(d.cert !== 'Yes'){ var c = app.querySelector('[data-i="cert"]'); c.classList.add('bad'); c.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    var rows = [['Applying for', d.applyFor || '']];
    for(var j = 0; j < STEPS.length - 1; j++){ rowsFor(j).forEach(function(r){ if(r[0] !== 'Application · Who is this application for?') rows.push([r[0], r[1]]); }); }
    var payload = {
      ref: ref,
      insured: [d.First, d.Middle, d.Last, d.Suffix].filter(Boolean).join(' '),
      owner: notMe() ? [d.oFirst, d.oLast].filter(Boolean).join(' ') : '',
      contact: notMe() ? (d.oMobile || '') : (d.mobile || ''),
      email: String((notMe() ? d.oEmail : d.email) || '').trim(),
      firstName: notMe() ? (d.oFirst || '') : (d.First || ''),
      rows: rows
    };
    var btn = document.getElementById('btnNext');
    var errBox = document.getElementById('formErr');
    errBox.innerHTML = '';
    if(!/^https:\/\/script\.google\.com\//.test(APP_URL)){
      errBox.innerHTML = '<div class="formerr">This form isn’t connected to the Google Sheet yet, so nothing was sent. Please message Donna on <a href="' + MESSENGER + '" target="_blank" rel="noopener">Messenger</a>.</div>';
      return;
    }
    btn.disabled = true; btn.textContent = 'Sending…';
    fetch(APP_URL, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function(){
        try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(STORE_KEY + '-step'); } catch(e){}
        showDone(payload.insured, payload.email);
      })
      .catch(function(){
        btn.disabled = false; btn.textContent = 'Submit application';
        errBox.innerHTML = '<div class="formerr">We couldn’t send your answers. Please check your internet connection and tap Submit again. Your answers are still saved on this device.</div>';
      });
  }
  function showDone(name, email){
    var validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email || '');
    document.getElementById('bar').hidden = true;
    document.getElementById('prog').hidden = true;
    document.getElementById('savedNote').hidden = true;
    app.innerHTML = '<div class="done"><img src="' + DONNA_IMG + '" alt="Donna Nuqui" width="84" height="84"><h1>Thank you!</h1>'
      + '<p>I’ve received the application details' + (name ? ' for <b>' + esc(name) + '</b>' : '') + '. I’ll review them and message you if anything needs to be clarified.</p>'
      + (validEmail ? '<p>A copy of your answers is on its way to <b>' + esc(email) + '</b>. If you don’t see it in a few minutes, check your Spam or Promotions folder.</p>' : '')
      + '<p>Next, please send me the photos of your requirements on Messenger so we can complete the application.</p>'
      + '<p><a href="' + MESSENGER + '" target="_blank" rel="noopener" class="btn btn-next" style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:0 24px">Message Donna</a></p></div>';
    window.scrollTo(0, 0);
  }

  renderStep();
})();
</script>
</body>
</html>
